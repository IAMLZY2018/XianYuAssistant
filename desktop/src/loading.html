<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>闲鱼助手</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        color: #182429;
        background: #f5f7f8;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      }

      .startup {
        display: flex;
        min-width: 260px;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .mark {
        display: grid;
        width: 72px;
        height: 72px;
        place-items: center;
        border-radius: 16px;
        color: #ffffff;
        background: #0f766e;
        box-shadow: 0 8px 22px rgb(15 118 110 / 18%);
        font-size: 38px;
        font-weight: 700;
        line-height: 1;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .status {
        margin: -8px 0 0;
        color: #607078;
        font-size: 14px;
        letter-spacing: 0;
      }

      .loader {
        width: 148px;
        height: 3px;
        overflow: hidden;
        border-radius: 2px;
        background: #d9e1e4;
      }

      .loader::after {
        display: block;
        width: 48px;
        height: 100%;
        border-radius: inherit;
        background: #ef8354;
        content: "";
        animation: progress 1.15s ease-in-out infinite;
      }

      @keyframes progress {
        from {
          transform: translateX(-54px);
        }
        to {
          transform: translateX(154px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader::after {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <main class="startup" aria-live="polite">
      <div class="mark" aria-hidden="true">闲</div>
      <h1>闲鱼助手</h1>
      <p class="status">正在启动本地服务...</p>
      <div class="loader" aria-hidden="true"></div>
    </main>
  </body>
</html>
